<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello, World.</title>
<meta name="description" content="一个文件，零依赖的 Hello World。">
<style>
  :root{
    --bg:#08090c;
    --fg:#f2f5f9;
    --muted:#78839a;
    --accent:#8fb2ff;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100dvh;
    background:var(--bg);
    color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
                "PingFang SC","Microsoft YaHei",sans-serif;
    display:grid;
    place-items:center;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* 环境光：一层很淡的顶部/角落渐变 */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(1100px 600px at 50% -15%, rgba(122,162,255,.10), transparent 70%),
      radial-gradient(900px 500px at 5% 115%, rgba(170,120,255,.07), transparent 70%);
    pointer-events:none;
  }

  /* 跟随指针的光晕（由 JS 平滑插值驱动） */
  .glow{
    position:fixed; left:0; top:0;
    width:560px; height:560px;
    margin:-280px 0 0 -280px;
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(143,178,255,.15),
      rgba(143,178,255,.05) 42%,
      transparent 64%);
    pointer-events:none;
    will-change:transform;
  }

  .content{
    position:relative;
    text-align:center;
    padding:0 24px;
  }

  .title{
    margin:0;
    font-size:clamp(2.4rem, 9vw, 6rem);
    font-weight:800;
    letter-spacing:-.035em;
    line-height:1.05;
    color:#fff;
    text-shadow:0 0 48px rgba(143,178,255,.22);
  }

  /* 逐字入场：每个字母从下方翻起来 */
  .title span{
    display:inline-block;
    opacity:0;
    transform:translateY(.4em) rotateX(-45deg);
    transform-origin:50% 100%;
    animation:rise .85s cubic-bezier(.22,1,.36,1) forwards;
    animation-delay:calc(var(--i) * 55ms + 180ms);
  }
  .title span.dot{ color:var(--accent); }

  @keyframes rise{ to{ opacity:1; transform:none; } }

  .sub{
    margin:20px 0 0;
    font-size:clamp(.78rem, 1.6vw, .92rem);
    letter-spacing:.18em;
    color:var(--muted);
    opacity:0;
    animation:fadeUp .9s cubic-bezier(.22,1,.36,1) 1.1s forwards;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:none; }
  }

  .hint{
    position:fixed;
    left:50%;
    bottom:max(24px, env(safe-area-inset-bottom));
    translate:-50% 0;
    font-size:.72rem;
    letter-spacing:.2em;
    color:#3f4859;
    opacity:0;
    animation:fadeIn 1.2s ease 2.2s forwards;
    user-select:none;
    pointer-events:none;
  }
  @keyframes fadeIn{ to{ opacity:1; } }

  /* 点击粒子 */
  .particle{
    position:fixed; left:0; top:0;
    width:var(--s); height:var(--s);
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px rgba(143,178,255,.7);
    pointer-events:none;
    transform:translate(-50%,-50%);
    animation:fly .75s cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes fly{
    from{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    to{
      transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.1);
      opacity:0;
    }
  }

  /* 尊重系统「减少动态效果」设置 */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-delay:0ms !important;
      transition-duration:.01ms !important;
    }
    .title span,.sub,.hint{ opacity:1; transform:none; }
  }
</style>
</head>
<body>

  <div class="glow" id="glow" aria-hidden="true"></div>

  <main class="content">
    <h1 class="title" id="title" aria-label="Hello, World."></h1>
    <p class="sub">一个文件 · 零依赖 · 无框架</p>
  </main>

  <div class="hint" aria-hidden="true">移动指针 · 点击任意处</div>

<script>
(() => {
  const glow  = document.getElementById('glow');
  const title = document.getElementById('title');
  const TEXT  = 'Hello, World.';

  /* 1. 把标题拆成逐字动画的 span */
  title.innerHTML = [...TEXT].map((ch, i) => {
    const cls = ch === '.' ? ' class="dot"' : '';
    const c   = ch === ' ' ? '&nbsp;' : ch;
    return `<span style="--i:${i}"${cls}>${c}</span>`;
  }).join('');

  /* 2. 光晕以缓动插值平滑跟随指针（比直接赋值更"黏"） */
  let tx = innerWidth / 2, ty = innerHeight / 2;
  let cx = tx, cy = ty;

  addEventListener('pointermove', e => {
    tx = e.clientX; ty = e.clientY;
  }, { passive: true });

  (function loop(){
    cx += (tx - cx) * 0.085;
    cy += (ty - cy) * 0.085;
    glow.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
    requestAnimationFrame(loop);
  })();

  /* 3. 点击处爆散粒子 */
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const ACCENT  = getComputedStyle(document.documentElement)
                    .getPropertyValue('--accent').trim() || '#8fb2ff';

  function burst(x, y){
    if (reduced.matches) return;
    const COUNT = 16;
    for (let i = 0; i < COUNT; i++){
      const p = document.createElement('i');
      p.className = 'particle';

      const angle = (Math.PI * 2 * i) / COUNT + Math.random() * 0.6;
      const dist  = 45 + Math.random() * 95;
      const size  = 2 + Math.random() * 4;

      p.style.setProperty('--s',  size + 'px');
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      p.style.left = x + 'px';
      p.style.top  = y + 'px';
      p.style.background = Math.random() > 0.7 ? '#ffffff' : ACCENT;

      document.body.appendChild(p);
      p.addEventListener('animationend', () => p.remove(), { once: true });
    }
  }

  addEventListener('pointerdown', e => burst(e.clientX, e.clientY));
})();
</script>
</body>
</html>
